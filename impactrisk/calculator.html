<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Energy and Water Calculator</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        select,
        input {
            margin-top: 5px;
            width: 100%;
            padding: 4px;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .left-col,
        .right-col {
            min-width: 250px;
        }

        .switch {
            margin-top: 10px;
        }

        .output {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }
    </style>
</head>

<body>
    <h1>AI Energy and Water Calculator</h1>

    <div class="calculator-grid">
        <fieldset class="left-col">
            <legend>Task</legend>
            <label for="ai-task">Generate with a text prompt</label>
            <select id="ai-task">
                <option value="Paragraph of AI text">Paragraph of AI text</option>
                <option value="10 lines of AI code">10 lines of AI code</option>
                <option value="1024x1024 AI image">1024x1024 AI image</option>
                <option value="3-second AI video from text">3-second AI video from text</option>
                <option value="3-second AI video from image">3-second AI video from image</option>
            </select>

            <label for="non-ai-task">Non-AI equivalent</label>
            <select id="non-ai-task">
                <option value="Searching Google without AI">Searching Google without AI</option>
                <option value="Charging a smartphone">Charging a smartphone</option>
                <option value="Storing 5 GB in the cloud for 1 month">Storing 5 GB in the cloud for 1 month</option>
                <option value="Watching 2-hour Netflix movie">Watching 2-hour Netflix movie</option>
                <option value="Zooming for 1 hour with 10 people">Zooming for 1 hour with 10 people</option>
            </select>

            <label for="energy-units">Output units:</label>
            <select id="energy-units">
                <option value="Wh">Watt-hours (Wh)</option>
                <option value="J">Joules (J)</option>
                <option value="gCO2">Grams of CO₂ (gCO2)</option>
            </select>

            <label for="water-units">Water units:</label>
            <select id="water-units">
                <option value="cc">Cubic centimeters</option>
                <option value="l">Liters</option>
            </select>
        </fieldset>
        <fieldset class="right-col">
            <legend>Parameters</legend>
            <div class="switch">
                <label>Location:
                    <select id="location">
                        <option value="solar">Solar-powered (CA)</option>
                        <option value="coal">Coal-powered (WV)</option>
                    </select>
                </label>
            </div>

            <div class="switch">
                <label>Prompt complexity:
                    <select id="complexity">
                        <option value="simple">Simple</option>
                        <option value="complex">Complex</option>
                        <option value="reasoning">Reasoning</option>
                    </select>
                </label>
            </div>

            <div class="switch">
                <label>Number of prompts:
                    <select id="prompt-count">
                        <option value="single">Single (zero-shot)</option>
                        <option value="multi">Multi-step</option>
                    </select>
                </label>
            </div>

            <div class="switch">
                <label>Season:
                    <select id="season">
                        <option value="summer">Summer</option>
                        <option value="winter">Winter</option>
                    </select>
                </label>
            </div>
        </fieldset>
    </div>

    <button onclick="calculate()">Calculate</button>

    <div class="output">
        <p>AI task energy: <span id="ai-energy">--</span> <span id="ai-emoji"></span></p>
        <p>Equivalent non-AI units: <span id="nonai-equivalent">--</span> <span id="nonai-emoji"></span></p>
    </div>

    <script>
        // Fetch and parse Google Sheet data for energy values
        async function fetchSheetData() {
            // Google Sheet as JSON endpoint
            const sheetId = "1xgvGhd6rmnBAEk9t2lesKlJeUy4TRQHrW6uWDSEVDFY";
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

            const response = await fetch(url);
            const text = await response.text();
            // Remove Google JSONP wrapper
            const json = JSON.parse(text.substr(47).slice(0, -2));
            const rows = json.table.rows;

            // Parse rows into a single object for both AI and non-AI tasks
            let energyValues = {};

            rows.forEach(row => {
                // Only two columns: [Task, Energy]
                let taskPair = row.c[0] || { v: "" };
                let energyPair = row.c[1] || { v: "" };

                if (taskPair.v && energyPair.v) {
                    energyValues[taskPair.v] = parseFloat(energyPair.v);
                }
            });

            return energyValues;
        }

        let energyData = null;

        async function calculate() {
            // Fetch data if not already loaded
            if (!energyData) {
                energyData = await fetchSheetData();
            }

            // Example usage:
            const aiTask = document.getElementById("ai-task").value;
            const nonAITask = document.getElementById("non-ai-task").value;

            const aiEnergy = energyData[aiTask];
            const nonAIEnergy = energyData[nonAITask];

            // ...rest of your calculation logic using aiEnergy and nonAIEnergy...
            document.getElementById("ai-energy").textContent = aiEnergy !== undefined ? aiEnergy : "--";
            document.getElementById("nonai-equivalent").textContent = nonAIEnergy !== undefined ? nonAIEnergy : "--";
        }
    </script>
</body>

</html>
