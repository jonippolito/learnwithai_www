<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Energy and Water Calculator</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        select,
        input {
            margin-top: 5px;
            width: 100%;
            padding: 4px;
        }

        .calculator-grid {
            display: flex;
            gap: 32px;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .left-col,
        .right-col {
            flex: 1 1 0;
            min-width: 250px;
        }

        .switch {
            margin-top: 10px;
        }

        .output {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }
    </style>
</head>

<body>
    <h1>AI Energy and Water Calculator</h1>

    <div class="calculator-grid">
        <fieldset class="left-col">
            <legend>Task</legend>
            <label for="ai-task">Generate with a text prompt</label>
            <select id="ai-task">
                <option value="1 text paragraph">1 text paragraph</option>
                <option value="10 lines of code">10 lines of code</option>
                <option value="1 1024x1024 image">1 1024x1024 image</option>
                <option value="1 3-second video">1 3-second video</option>
            </select>

            <label for="non-ai-task">Non-AI equivalent</label>
            <select id="non-ai-task">
                <option value="Searching Google without AI">Searching Google without AI</option>
                <option value="Charging a smartphone">Charging a smartphone</option>
                <option value="Storing 5 GB in the cloud (not transfer)">Storing 5 GB in the cloud (not transfer)</option>
                <option value="Watching 2-hour Netflix movie">Watching 2-hour Netflix movie</option>
                <option value="Zooming for 1 hour with 10 people">Zooming for 1 hour with 10 people</option>
            </select>
        </fieldset>
        <fieldset class="right-col">
            <legend>Parameters</legend>
            <div class="switch">
                <label>Location:
                    <select id="location">
                        <option value="solar">Solar-powered (CA)</option>
                        <option value="coal">Coal-powered (WV)</option>
                    </select>
                </label>
            </div>

            <div class="switch">
                <label>Prompt complexity:
                    <select id="complexity">
                        <option value="simple">Simple</option>
                        <option value="complex">Complex</option>
                        <option value="reasoning">Reasoning</option>
                    </select>
                </label>
            </div>

            <div class="switch">
                <label>Number of prompts:
                    <select id="prompt-count">
                        <option value="single">Single (zero-shot)</option>
                        <option value="multi">Multi-step</option>
                    </select>
                </label>
            </div>

            <div class="switch">
                <label>Season:
                    <select id="season">
                        <option value="summer">Summer</option>
                        <option value="winter">Winter</option>
                    </select>
                </label>
            </div>

            <div class="switch">
                <label>Output units:
                    <select id="energy-units">
                        <option value="Wh">Watt-hours (Wh)</option>
                        <option value="J">Joules (J)</option>
                        <option value="gCO2">Grams of CO₂ (gCO2)</option>
                    </select>
                </label>
            </div>

            <div class="switch">
                <label>Water units:
                    <select id="water-units">
                        <option value="cc">Cubic centimeters</option>
                        <option value="l">Liters</option>
                    </select>
                </label>
            </div>
        </fieldset>
    </div>

    <button onclick="calculate()">Calculate</button>

    <div class="output">
        <p>AI task energy: <span id="ai-energy">--</span> <span id="ai-emoji"></span></p>
        <p>Equivalent non-AI units: <span id="nonai-equivalent">--</span> <span id="nonai-emoji"></span></p>
    </div>

    <script>
        function calculate() {
            // Very rough placeholder values for demonstration
            const baseEnergy = {
                "1 text paragraph": 0.05,
                "10 lines of code": 0.08,
                "1 1024x1024 image": 2.0,
                "1 3-second video": 6.0
            };
            const nonAIEquiv = {
                "Charging a smartphone": 5,
                "Watching 2-hour Netflix movie": 360,
                "Storing 5 GB in the cloud (not transfer)": 15,
                "Searching Google without AI": 0.3,
                "Zooming for 1 hour with 10 people": 70
            };

            const aiTask = document.getElementById("ai-task").value;
            const nonAiTask = document.getElementById("non-ai-task").value;
            const complexity = document.getElementById("complexity").value;
            const promptCount = document.getElementById("prompt-count").value;
            const location = document.getElementById("location").value;
            const season = document.getElementById("season").value;
            const units = document.getElementById("energy-units").value;

            let energy = baseEnergy[aiTask] || 0.5;

            // Apply multipliers
            if (complexity === "complex") energy *= 2;
            if (complexity === "reasoning") energy *= 3;
            if (promptCount === "multi") energy *= 2;
            if (location === "coal") energy *= 1.5;
            if (season === "winter") energy *= 1.1;

            let emojiCount = Math.round(energy);
            let nonAIenergy = nonAIEquiv[nonAiTask] || 1;
            let equivalentUnits = (energy / nonAIenergy).toFixed(2);

            // Unit conversion (to joules or CO2 as a very rough calc)
            if (units === "J") energy *= 3600;
            if (units === "gCO2") energy *= (location === "coal" ? 800 : 50); // very rough gCO2 per Wh

            document.getElementById("ai-energy").textContent = energy.toFixed(2) + " " + units;
            document.getElementById("ai-emoji").textContent = "💡".repeat(Math.min(emojiCount, 20));
            document.getElementById("nonai-equivalent").textContent = equivalentUnits + " x " + nonAiTask;
            document.getElementById("nonai-emoji").textContent = "🛰".repeat(Math.min(Math.round(equivalentUnits), 20));
        }
    </script>
</body>

</html>
