<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Login - My Account</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* General styles for the login page */
        body {
            font-family: 'Verdana', sans-serif;
            background-color: hsl(210, 50%, 95%);
            /* Light blue */
            color: hsl(210, 20%, 20%);
            /* Dark blue-gray */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: hsl(210, 40%, 98%);
            /* Very light blue */
            border: 1px solid hsl(210, 30%, 80%);
            /* Soft blue-gray */
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: fit-content;
            text-align: center;
        }

        h1 {
            font-size: 1.8em;
            color: hsl(210, 30%, 25%);
            /* Medium blue-gray */
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid hsl(210, 30%, 80%);
            /* Soft blue-gray */
            border-radius: 4px;
            font-size: 1em;
        }

        button {
            background: hsl(210, 50%, 40%);
            /* Strong blue */
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
        }

        button:hover {
            background: hsl(210, 50%, 35%);
            /* Darker blue */
        }

        p {
            margin-top: 15px;
            font-size: 0.9em;
        }

        a {
            color: hsl(210, 50%, 40%);
            /* Strong blue */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>🦹‍♂️ Login to My Account</h1>
        <form action="/login" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
</body>

</html>
